server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # O index.html não tem hash no nome: sem esta linha o navegador decide
        # sozinho por quanto tempo reaproveita a cópia antiga, e ela aponta
        # para o bundle da versão anterior. "no-cache" não proíbe guardar —
        # manda revalidar (ETag) a cada visita; sem mudança, a resposta é 304.
        # Vale para "/" e para as rotas do React Router, que caem aqui pelo
        # try_files. Os arquivos com hash ficam no bloco abaixo.
        add_header Cache-Control "no-cache";
    }

    # Cache para arquivos estáticos (opcional)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
